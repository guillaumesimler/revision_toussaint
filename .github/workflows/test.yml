name: test
on:
  push:
  pull_request:
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Built files match src/
        run: python build.py && git diff --exit-code -- elena.html sarah.html
      - name: Content checks and full playthrough
        run: python tests/test_play.py
